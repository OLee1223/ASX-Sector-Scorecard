[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thematic-risk"
version = "0.1.0"
description = "Thematic portfolio risk engine: factor model, Monte Carlo VaR/ES, stress tests and backtests."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
